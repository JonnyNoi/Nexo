name: Versão

# Ao publicar uma etiqueta "vX.Y" (ex.: git tag -a v2.2 -m "…" && git push --tags):
#   testes → executável Linux + AppImage + Nexo.exe + instalador do Windows → release no GitHub com SHA256SUMS.
# O Nexo instalado procura estas releases (UPDATE_REPO em nexo/core/util.py) e confirma o SHA-256
# que o GitHub publica para cada ficheiro antes de se atualizar.
#
# Assinatura do Windows (opcional): defina os segredos do repositório
#   WINDOWS_CERT_PFX       — certificado de assinatura de código (.pfx) em base64
#   WINDOWS_CERT_PASSWORD  — palavra-passe do .pfx
# Sem eles, o .exe sai sem assinatura (o SmartScreen avisa "editor desconhecido").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  linux:
    needs: testes
    runs-on: ubuntu-22.04          # glibc mais antiga = o executável corre em mais distribuições
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versão da etiqueta = APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' nexo/core/util.py)
          [ "v$app" = "${GITHUB_REF_NAME}" ] || { echo "Etiqueta ${GITHUB_REF_NAME} ≠ APP_VERSION $app"; exit 1; }
      - name: Bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: PyInstaller
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name Nexo \
              --distpath dist --workpath build/linux --specpath build/linux run_nexo.py
      - name: AppImage
        run: |
          sudo apt-get install -y file
          PYTHON=python ./packaging/appimage/build_appimage.sh
          cp Aplicacao/Linux/Nexo-x86_64.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Nexo
            dist/Nexo-x86_64.AppImage

  windows:
    needs: testes
    runs-on: windows-latest
    env:
      PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name Nexo `
              --icon "$pwd\assets\nexo.ico" --distpath Aplicacao/Windows --workpath build/windows `
              --specpath build/windows run_nexo.py
      - name: Assinar o Nexo.exe
        if: env.PFX != ''
        shell: pwsh
        run: ./packaging/windows/sign.ps1 Aplicacao/Windows/Nexo.exe
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = (Select-String -Path nexo/core/util.py -Pattern '^APP_VERSION = "(.*)"').Matches[0].Groups[1].Value
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado" }
          & $iscc.FullName /Q "/DAppVersion=$ver" packaging\windows\nexo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
      - name: Assinar o instalador
        if: env.PFX != ''
        shell: pwsh
        run: Get-ChildItem Aplicacao/Windows/Nexo-Instalador-*.exe | ForEach-Object { ./packaging/windows/sign.ps1 $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Aplicacao/Windows/Nexo.exe
            Aplicacao/Windows/Nexo-Instalador-*.exe

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd out && chmod +x Nexo Nexo-x86_64.AppImage
          sha256sum Nexo Nexo-x86_64.AppImage Nexo.exe Nexo-Instalador-*.exe | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
